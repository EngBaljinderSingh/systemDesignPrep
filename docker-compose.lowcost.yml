services:
  # ──────────────────────────────────────────────
  # Caddy — automatic HTTPS + reverse proxy
  # Set DOMAIN env var to your actual domain.
  # ──────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - sdp-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: lowcost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/systemdesignprep
      SPRING_DATASOURCE_USERNAME: sdp_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SDP_CACHE_PROVIDER: memory
      SDP_CODE_RUNNER_ENABLED: "false"
      # Set to https://yourdomain.com — Caddy handles the frontend origin
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://${DOMAIN:-localhost}}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:+UseSerialGC -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - sdp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_CODE_RUNNER: "false"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sdp-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: systemdesignprep
      POSTGRES_USER: sdp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdp_user -d systemdesignprep"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sdp-network

volumes:
  pgdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  sdp-network:
    driver: bridge
