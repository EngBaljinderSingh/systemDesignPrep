spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.systemdesignprep: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN

server:
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json,text/html,text/plain,text/css,application/javascript

sdp:
  cache:
    provider: memory
  code-runner:
    enabled: false
